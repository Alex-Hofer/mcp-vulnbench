# Taint through zod, the schema library the TypeScript SDK is built on. Handlers of the low-level
# server get the raw arguments and validate them with a schema before use; CodeQL has no model of
# zod, so without these rows the MCP input is lost at the parse call. A parsed value is still
# caller-chosen: validation narrows it, it does not make it trusted.
extensions:
  - addsTo:
      pack: codeql/javascript-all
      extensible: typeModel
    data:
      - ["zod", "zod/v3", ""]
      - ["zod", "zod/v4", ""]

  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      - ["zod", "Fuzzy.Member[parse]", "Argument[0]", "ReturnValue", "taint"]
      - ["zod", "Fuzzy.Member[safeParse]", "Argument[0]", "ReturnValue.Member[data]", "taint"]
      - ["zod", "Fuzzy.Member[parseAsync]", "Argument[0]", "ReturnValue.Awaited", "taint"]
      - ["zod", "Fuzzy.Member[safeParseAsync]", "Argument[0]", "ReturnValue.Awaited.Member[data]", "taint"]
