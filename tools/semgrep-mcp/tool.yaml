# Like semgrep-default plus the official MCP rules (ai/ai-best-practices/mcp-*, typescript/mcp).
name: semgrep-mcp
tool: semgrep
version: "1.178.0"
image: mcpvb/semgrep:1.178.0-rules-a84ff9c
dockerfile: docker/semgrep
languages: [python, typescript, javascript]
command: [semgrep, scan, --config, /rules/default, --config, /rules/mcp, --sarif, --output, "{out}/raw.sarif", --metrics, "off", --disable-version-check, --disable-nosem, --timeout, "0", "{src}"]
timeout_s: 1800
