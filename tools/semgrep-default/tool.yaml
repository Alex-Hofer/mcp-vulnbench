# Semgrep CE with the security rules of the case language from semgrep/semgrep-rules.
name: semgrep-default
tool: semgrep
version: "1.178.0"
image: mcpvb/semgrep:1.178.0-rules-a84ff9c
dockerfile: docker/semgrep
languages: [python]
command: [semgrep, scan, --config, /rules/default, --sarif, --output, "{out}/raw.sarif", --metrics, "off", --disable-version-check, --disable-nosem, --timeout, "0", "{src}"]
timeout_s: 1800
