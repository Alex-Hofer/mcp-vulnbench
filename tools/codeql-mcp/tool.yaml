# CodeQL with the security-extended suite plus the MCP models in models/codeql/mcp.
# Identical to the codeql variant except for the two model-pack options.
name: codeql-mcp
tool: codeql
version: "2.27.1"
image: mcpvb/codeql-mcp:2.27.1
base_image: mcpvb/codeql:2.27.1
dockerfile: models/codeql
languages: [python]
command: [run-codeql.sh, "{lang}", "{src}", "{out}", "--additional-packs=/opt/mcpvb/models", "--model-packs=mcpvb/mcp-models"]
timeout_s: 3600
