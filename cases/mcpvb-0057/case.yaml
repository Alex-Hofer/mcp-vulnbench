id: mcpvb-0057
title: "SSRF in web_url_read of mcp-searxng (internal-address guard off by default)"
advisories: [CVE-2026-54688, GHSA-q87f-qc2r-2gw4]
repo: https://github.com/ihor-sokoliuk/mcp-searxng
license: MIT
language: typescript
subdir: null
class: ssrf
cwe: CWE-918
mcp_tool: web_url_read
vulnerable:
  commit: 3010d1e80ee21baa3d33fcbe0fe2bd5006f285e2
  locations:
    - {file: src/url-reader.ts, function: fetchAndConvertToMarkdown, lines: [200, 341]}
    - {file: src/url-reader.ts, function: assertUrlAllowed, lines: [70, 79]}
fixed:
  commit: 48e5ecdcb4166a60b94c252dbe74b0a318110ac4
  locations:
