id: mcpvb-0005
title: "Path traversal in create_workbook of excel-mcp-server"
advisories: [CVE-2026-40576, GHSA-j98m-w3xp-9f56]
repo: https://github.com/haris-musa/excel-mcp-server
license: MIT
language: python
subdir: null
class: path-traversal
cwe: CWE-22
mcp_tool: create_workbook
vulnerable:
  commit: de4dc75f6ba629ccd2e097f5963235846be622e6
  locations:
    - {file: src/excel_mcp/server.py, function: get_excel_path, lines: [75, 94]}
    - {file: src/excel_mcp/workbook.py, function: create_workbook, lines: [12, 33]}
fixed:
  commit: f51340ecd5778952405044b203d3a2d4c8a46833
  locations:
    - {file: src/excel_mcp/server.py, function: get_excel_path, lines: [87, 113]}
    - {file: src/excel_mcp/workbook.py, function: create_workbook, lines: [12, 33]}
source: ghsa
split: null
notes: "get_excel_path(), which every file tool calls on its filepath argument, returned absolute paths unchanged and joined relative ones onto EXCEL_FILES_PATH without resolving them, so absolute or ../ paths escaped the sandbox in SSE/HTTP mode (the create_workbook tool's implementation in workbook.py then runs mkdir(parents=True) and saves there); the fix rejects absolute paths and NUL bytes in get_excel_path and requires the realpath to stay inside EXCEL_FILES_PATH. Fix: https://github.com/haris-musa/excel-mcp-server/commit/f51340ecd5778952405044b203d3a2d4c8a46833"
