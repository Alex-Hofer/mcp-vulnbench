id: mcpvb-0017
title: "Path traversal in cleanup_attachments of mail-mcp-bridge"
advisories: [CVE-2026-7386, GHSA-2gfj-fr43-4735]
repo: https://github.com/fatbobman/mail-mcp-bridge
license: MIT
language: python
subdir: null
class: path-traversal
cwe: CWE-22
mcp_tool: cleanup_attachments
vulnerable:
  commit: d9e7d9acc2abcf9da8252d76506fc5afbc08d08e
  locations:
    - {file: src/cleanup_attachments.py, function: cleanup_attachments, lines: [27, 106]}
    - {file: src/extract_attachments.py, function: extract_attachments, lines: [60, 233]}
fixed:
  commit: 638b162b26532e32fa8d8047f638537dbdfe197a
  locations:
