id: mcpvb-0063
title: "SSRF via Hackmd-Api-Url header of hackmd-mcp"
advisories: [CVE-2025-59155, GHSA-g5cg-6c7v-mmpw]
repo: https://github.com/yuna0x0/hackmd-mcp
license: MIT
language: typescript
subdir: null
class: ssrf
cwe: CWE-918
mcp_tool: Hackmd-Api-Url
vulnerable:
  commit: 35af63cdc8a1bc6a35c159686722722a81db94f7
  locations:
    - {file: index.ts, function: parseConfig, lines: [45, 82]}
    - {file: index.ts, function: "<anonymous> POST /mcp handler", lines: [101, 153]}
    - {file: index.ts, function: createServer, lines: [85, 98]}
fixed:
  commit: 43936c78a5bb3dedc74e8f080607a1125caa8c13
  locations:
