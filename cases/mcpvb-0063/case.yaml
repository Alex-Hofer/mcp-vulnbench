source: ghsa
split: dev
notes: "In HTTP mode every request to the /mcp endpoint may carry a Hackmd-Api-Url header (or a base64-encoded JSON config query parameter); parseConfig takes its value as hackmdApiUrl and the POST /mcp handler passes it to createServer, which builds the @hackmd/api client with it as base URL (new API(token, url)), so every tool call sends its requests, including the API token, to the host chosen by the MCP client. The fix validates the URL in the POST /mcp handler against an allowlist (ALLOWED_HACKMD_API_URLS, default only https://api.hackmd.io/v1). The tainted value is a header of the MCP HTTP transport, not a tool argument; the HTTP requests themselves are made inside the @hackmd/api dependency, createServer is where the URL enters the client. Fix: https://github.com/yuna0x0/hackmd-mcp/commit/43936c78a5bb3dedc74e8f080607a1125caa8c13"
