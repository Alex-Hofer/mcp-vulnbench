id: mcpvb-0028
title: "Path traversal in create_notebook of python-notebook-mcp"
advisories: [CVE-2026-7810, GHSA-m4mw-6cr3-7cc7]
repo: https://github.com/UsamaK98/python-notebook-mcp
license: MIT
language: python
subdir: null
class: path-traversal
cwe: CWE-22
mcp_tool: create_notebook
vulnerable:
  commit: a05a232815809a7e425b5fa7be26e0d4369894c2
  locations:
    - {file: server.py, function: create_notebook, lines: [344, 366]}
    - {file: server.py, function: resolve_path, lines: [76, 83]}
    - {file: server.py, function: create_new_notebook, lines: [96, 115]}
fixed:
  commit: 72c323973d068deac24d5b72748f25c8b64f27f7
  locations:
