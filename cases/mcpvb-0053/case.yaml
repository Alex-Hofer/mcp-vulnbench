vulnerable:
  commit: 6531de40da1b558513c78b1072d195bd9452c016
  locations:
    - {file: src/handlers/tools.ts, function: FafToolHandler.callTool, lines: [665, 747]}
    - {file: src/handlers/fileHandler.ts, function: handleFafRead, lines: [95, 158]}
    - {file: src/handlers/fileHandler.ts, function: handleFafWrite, lines: [163, 229]}
    - {file: src/handlers/tools.ts, function: FafToolHandler.getProjectPath, lines: [34, 57]}
fixed:
  commit: ae4a5017e18381116c026f7317b43a6dbdd8df73
  locations:
