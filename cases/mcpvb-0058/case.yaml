repo: https://github.com/ihor-sokoliuk/mcp-searxng
license: MIT
language: typescript
subdir: null
class: ssrf
cwe: CWE-918
mcp_tool: web_url_read
vulnerable:
  commit: 488d2a067b91edc358853b44f5245ff55363cb06
  locations:
    - {file: src/url-reader.ts, function: fetchAndConvertToMarkdown, lines: [285, 468]}
    - {file: src/url-reader.ts, function: checkContentLength, lines: [219, 255]}
    - {file: src/url-reader.ts, function: assertUrlAllowed, lines: [85, 94]}
fixed:
  commit: 14575eaaa46a21391477d2b68673858ba6b52bd6
  locations:
    - {file: src/url-reader.ts, function: fetchAndConvertToMarkdown, lines: [227, 414]}
