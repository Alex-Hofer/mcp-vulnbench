id: mcpvb-0013
title: "Code injection in ado_package_install of stata-mcp"
advisories: [CVE-2026-55071, GHSA-49m4-vp58-wgc9]
repo: https://github.com/SepineTam/mcp-for-stata
license: AGPL-3.0-only
language: python
subdir: null
class: code-injection
cwe: CWE-94
mcp_tool: ado_package_install
vulnerable:
  commit: de13adf9260ef1d846098857489932b48a078573
  locations:
    - {file: src/stata_mcp/mcp_servers.py, function: ado_package_install, lines: [308, 378]}
    - {file: src/stata_mcp/stata/builtin_tools/ado_install/ssc_install.py, function: SSC_Install.install, lines: [14, 17]}
    - {file: src/stata_mcp/stata/stata_controller/controller.py, function: StataController.run, lines: [81, 119]}
fixed:
  commit: b2bc49ec447836e0b1d442ece472c42b7f78724b
  locations:
    - {file: src/stata_mcp/mcp_servers.py, function: ado_package_install, lines: [308, 386]}
    - {file: src/stata_mcp/stata/builtin_tools/ado_install/ssc_install.py, function: SSC_Install.install, lines: [15, 19]}
    - {file: src/stata_mcp/stata/stata_controller/controller.py, function: StataController.run, lines: [81, 119]}
source: ghsa
split: test
notes: "The ado_package_install tool (default 'all' profile) interpolated the unvalidated package argument into 'ssc install {package}, replace' (SSC_Install.install), which StataController.run sends to the Stata REPL via pexpect sendline, so embedded newlines inject arbitrary Stata code including the shell escape (the sink is the Stata interpreter, hence code-injection as in the advisory); the fix, the first commit of the v1.19.0 hardening series, validates the source, package name and net location in the tool and in all three installers. Fix: https://github.com/SepineTam/mcp-for-stata/commit/b2bc49ec447836e0b1d442ece472c42b7f78724b"
