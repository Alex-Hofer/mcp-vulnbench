split: null
notes: "The CallTool handler passes the tool arguments unchanged to the tool functions; kubectlScale interpolated namespace, name and resourceType of kubectl_scale into a kubectl command string run with child_process.execSync (kubectlPatch and explainResource/executeKubectlCommand did the same for kubectl_patch and explain_resource), so a value such as 'a;id>/tmp/x' executes shell commands. The fix switches to execFileSync with argument arrays in these and ten further tool files with the same pattern; the listed locations are the tools the advisory names. The fix commit is the first commit of PR #176 (merged into main with merge commit 9a6cd14b7555e5abcba36ae58b25847da3ec4340 together with two unrelated feature commits), so the advisory's commit and its parent are used. Fix: https://github.com/Flux159/mcp-server-kubernetes/commit/ab165f5a0eea917fef5dbae954506fff6f4bf514 The advisory lists CWE-77, but the sink is an OS command string, so the case uses CWE-78. Caveat: the fixed functions still put name and resourceType into positional kubectl arguments, where a value such as --server=... is taken as a flag (fixed later in d7890f5), so a command-injection finding there may be a true positive for that bug rather than a missed fix."
