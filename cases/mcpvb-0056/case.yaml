  commit: 6e0038494a09c435f6a0a9a76fde2dc077f18b18
  locations:
    - {file: packages/mcp-tools/src/tools/jobs/space-to-space-migration/exportSpace.ts, function: tool, lines: [124, 173]}
    - {file: packages/mcp-tools/src/tools/jobs/space-to-space-migration/importSpace.ts, function: tool, lines: [101, 138]}
fixed:
