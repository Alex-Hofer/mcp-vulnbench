vulnerable:
  commit: 084e246d9957b4651d24344c4f13b7d248c1d8c1
  locations:
    - {file: src/scrapling_fetch_mcp/_fetcher.py, function: fetch_page_impl, lines: [75, 91]}
    - {file: src/scrapling_fetch_mcp/_fetcher.py, function: fetch_pattern_impl, lines: [94, 123]}
