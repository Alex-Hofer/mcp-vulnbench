id: mcpvb-0016
title: "Path traversal via unconfined output paths in apply_processing of Phantom"
advisories: [GHSA-52vm-mxx8-f227]
repo: https://github.com/fadelabs/phantom
license: AGPL-3.0-or-later
language: python
subdir: null
class: path-traversal
cwe: CWE-22
mcp_tool: apply_processing
vulnerable:
  commit: a8684e30713991138199694702f34f7123a830ce
  locations:
    - {file: src/phantom/_utils.py, function: validate_output_path, lines: [201, 244]}
    - {file: src/phantom/processing.py, function: apply_processing, lines: [262, 331]}
fixed:
  commit: 007235f02a5645513d353521bb8448b6e5c645a9
  locations:
    - {file: src/phantom/_utils.py, function: validate_output_path, lines: [249, 284]}
    - {file: src/phantom/processing.py, function: apply_processing, lines: [262, 331]}
source: ghsa
split: null
notes: "With PHANTOM_OUTPUT_DIR unset (the default), validate_output_path returned the caller-supplied path unchanged, so the MCP write tools such as apply_processing wrote their output (sf.write) to any path, e.g. shell startup files; the fix always confines writes to PHANTOM_OUTPUT_DIR or a default ~/.phantom/output sandbox and re-verifies the resolved path. Advisory CWEs: CWE-22, CWE-73 (externally controlled output path; the sink is a file write, hence CWE-22) and CWE-400 (decode-bomb DoS, fixed separately in abb67ea and not part of this case). Fix: https://github.com/fadelabs/phantom/commit/007235f02a5645513d353521bb8448b6e5c645a9 (release 1.3.1)"
