  commit: 3553a42677855f99514392eaf3a90d56d27a2037
  locations:
    - {file: src/stata_mcp/stata/stata_do/do.py, function: StataDo.execute_dofile, lines: [55, 98]}
    - {file: src/stata_mcp/stata/stata_do/do.py, function: StataDo._execute_unix_like, lines: [135, 200]}
fixed:
