source: ghsa
split: null
notes: "The stata_do tool (core and all profiles) passed log_file_name unvalidated to StataDo.execute_dofile; _execute_unix_like interpolates the log name into 'log using \"...\"' lines of the command script it writes to the Stata CLI's stdin, so quotes and newlines inject arbitrary Stata code including shell escapes (advisory CWE-77; the sink is the Stata interpreter, hence code-injection); the fix validates the name in execute_dofile against ^[A-Za-z0-9_.-]{1,128}$ and rejects '.' and '..'. Fix: https://github.com/SepineTam/mcp-for-stata/commit/e6f945941ae0c7cf5e74a428e0b3dc82b396382f (closes #74, released in 1.17.3)"
