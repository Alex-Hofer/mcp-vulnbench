split: null
notes: "The url argument of the fetchWebContent tool is only checked by isPublicHttpUrl/assertPublicHttpUrl; their isPrivateOrLocalHostname hands the bracketed URL.hostname of IPv6 literals such as [::1] or [::ffff:7f00:1] to isPrivateOrLocalIp, where isIP() returns 0, and never resolves hostnames, so fetchWebContent() sends axios.head/axios.get (and the cookie retry in tryRequestWithBrowserCookies) to loopback, private or metadata addresses and returns the body. The fix strips the brackets and classifies literals with ipaddr.js, resolves hostnames before the request (assertPublicHttpUrlResolved), routes all requests through the new requestWithSafeRedirects (manual redirects with a check per hop; it takes the place of the removed isPrivateOrLocalIp in the fixed locations and makes the request through axiosRequestImpl) and installs request-filtering-agent in buildAxiosRequestOptions. The fix is the merge commit of the advisory fork (six commits, 8c35c6b..8670d71); the vulnerable commit is its first parent (release 2.1.6). The advisory also lists CWE-20 and CWE-693. Fix: https://github.com/Aas-ee/open-webSearch/commit/a7309c9c619c7bc5add070aead2a233ce9698c76"
