id: mcpvb-0009
title: "SSRF via REST path traversal in netlicensing_get_product of netlicensing-mcp"
advisories: [CVE-2026-57496, GHSA-hxpf-9xvq-wph8]
repo: https://github.com/Labs64/NetLicensing-MCP
license: Apache-2.0
language: python
subdir: null
class: ssrf
cwe: CWE-918
mcp_tool: netlicensing_get_product
vulnerable:
  commit: 8f01239a8016befa31a4e4a90ecb6599763371b8
  locations:
    - {file: src/netlicensing_mcp/client.py, function: nl_get, lines: [141, 148]}
fixed:
  commit: b8fd0ea76d533202573eb24add9fb2fbd9331496
  locations:
    - {file: src/netlicensing_mcp/client.py, function: nl_get, lines: [169, 176]}
source: ghsa
split: null
notes: "netlicensing_get_product interpolates product_number into the REST path that nl_get sends with httpx, so '../token' collapses to the /token endpoint and returns API keys without the token-specific redaction; the fix validates every path segment (_validated_path) in nl_get and the other HTTP helpers. Advisory lists CWE-22; classified CWE-918 because the tainted path segment reaches an outgoing httpx request, not the filesystem. Fix: https://github.com/Labs64/NetLicensing-MCP/pull/6 (commit b8fd0ea76d533202573eb24add9fb2fbd9331496)"
