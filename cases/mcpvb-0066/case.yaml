id: mcpvb-0066
title: "SSRF via X-GitLab-API-URL header of gitlab-mcp"
advisories: [CVE-2026-61559, GHSA-2h44-8472-frjj]
repo: https://github.com/zereight/gitlab-mcp
license: MIT
language: typescript
subdir: null
class: ssrf
cwe: CWE-918
mcp_tool: X-GitLab-API-URL
vulnerable:
  commit: 79f45f8443b9ec720c881b32617ceb081404a3a7
  locations:
    - {file: index.ts, function: parseAuthHeaders, lines: [12338, 12385]}
    - {file: index.ts, function: listIssues, lines: [1960, 2001]}
fixed:
