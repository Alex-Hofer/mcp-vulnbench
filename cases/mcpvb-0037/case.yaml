id: mcpvb-0037
title: "Argument injection in port_forward of mcp-server-kubernetes"
advisories: [CVE-2026-39884, GHSA-4xqg-gf5c-ghwq]
repo: https://github.com/Flux159/mcp-server-kubernetes
license: MIT
language: typescript
subdir: null
class: command-injection
cwe: CWE-88
mcp_tool: port_forward
vulnerable:
  commit: 51df12dd9914e8382bd43f4268bdec660c05d1d0
  locations:
    - {file: src/tools/port_forward.ts, function: startPortForward, lines: [75, 119]}
    - {file: src/tools/port_forward.ts, function: executeKubectlCommandAsync, lines: [6, 54]}
fixed:
  commit: 4e2303cfa3903e4ea924b8d75c3d6908308e4e24
  locations:
    - {file: src/tools/port_forward.ts, function: startPortForward, lines: [74, 119]}
    - {file: src/tools/port_forward.ts, function: executePortForward, lines: [6, 53]}
source: ghsa
split: null
notes: "The CallTool handler passes the port_forward arguments to startPortForward, which concatenated namespace, resourceType and resourceName into a 'kubectl port-forward ...' string that executeKubectlCommandAsync split on spaces and passed to spawn, so a value such as 'my-db --address=0.0.0.0' injects additional kubectl flags (no shell is involved). The fix builds an argument array and calls spawn('kubectl', args) in the renamed helper executePortForward. Fixed commit is the merge commit of PR #300 on main (branch commit 8cb0683ffc9a6eb01b531881f1a97af0083e0fda). Fix: https://github.com/Flux159/mcp-server-kubernetes/pull/300 Caveat: the fixed startPortForward still appends resourceType/resourceName unguarded, and a value such as --server=... is taken as a kubectl flag (fixed later in 9a20ffd, PR #329), so a command-injection finding there may be a true positive for that bug rather than a missed fix."
