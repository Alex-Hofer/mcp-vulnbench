id: mcpvb-0059
title: "SSRF via server_url in ckan_package_search of ckan-mcp-server"
advisories: [CVE-2026-33060, GHSA-3xm7-qw7j-qc8v]
repo: https://github.com/ondata/ckan-mcp-server
license: MIT
language: typescript
subdir: null
class: ssrf
cwe: CWE-918
mcp_tool: ckan_package_search
vulnerable:
  commit: 5c1bea16fc9f9682f57ec2e1ac200efb5c1dd48e
  locations:
    - {file: src/utils/http.ts, function: makeCkanRequest, lines: [179, 295]}
    - {file: src/tools/sparql.ts, function: querySparqlEndpoint, lines: [46, 100]}
fixed:
  commit: 79c0c0677b082b87cf7304af9a654562083ffa84
  locations:
