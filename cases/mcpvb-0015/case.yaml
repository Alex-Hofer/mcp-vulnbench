id: mcpvb-0015
title: "Path traversal in export_session and import_session of mcp-sequential-thinking"
advisories: [CVE-2026-81845, GHSA-j8g6-hw52-mhg7]
repo: https://github.com/arben-adm/mcp-sequential-thinking
license: MIT
language: python
subdir: null
class: path-traversal
cwe: CWE-22
mcp_tool: export_session
vulnerable:
  commit: f3727d858769495befaf56e6b4f2e84509dc6456
  locations:
    - {file: mcp_sequential_thinking/storage.py, function: ThoughtStorage.export_session, lines: [102, 129]}
    - {file: mcp_sequential_thinking/storage.py, function: ThoughtStorage.import_session, lines: [131, 152]}
    - {file: mcp_sequential_thinking/storage_utils.py, function: save_thoughts_to_file, lines: [26, 58]}
    - {file: mcp_sequential_thinking/storage_utils.py, function: load_thoughts_from_file, lines: [61, 100]}
fixed:
  commit: 2fad3ee8ab1d0868b6c1afb5895bc336a10e5267
  locations:
    - {file: mcp_sequential_thinking/storage.py, function: ThoughtStorage.export_session, lines: [138, 170]}
    - {file: mcp_sequential_thinking/storage.py, function: ThoughtStorage.import_session, lines: [172, 198]}
    - {file: mcp_sequential_thinking/storage_utils.py, function: save_thoughts_to_file, lines: [27, 67]}
    - {file: mcp_sequential_thinking/storage_utils.py, function: load_thoughts_from_file, lines: [70, 133]}
source: ghsa
split: null
notes: "The export_session and import_session tools passed the caller-supplied file_path unchecked to ThoughtStorage, which wrote the session JSON to it (creating parent directories, sink open() in save_thoughts_to_file) or read it (load_thoughts_from_file), so any path outside the storage directory could be written or read; the fix resolves the path and confines it to the storage directory (_ensure_within) and no longer renames the caller's file on parse errors. Fix: https://github.com/arben-adm/mcp-sequential-thinking/pull/18 (merge commit 2fad3ee8ab1d0868b6c1afb5895bc336a10e5267, vulnerable = PR base)"
