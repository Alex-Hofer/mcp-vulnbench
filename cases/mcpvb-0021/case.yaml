id: mcpvb-0021
title: "Path traversal via the bearer token in the session lookup of fast-mcp-telegram"
advisories: [CVE-2026-52830, GHSA-rxw2-pc8j-vxwm]
repo: https://github.com/leshchenko1979/fast-mcp-telegram
license: MIT
language: python
subdir: null
class: path-traversal
cwe: CWE-22
mcp_tool: send_message
vulnerable:
  commit: 167ab705f1cd09b21e85c370570471fe75a4f8c9
  locations:
    - {file: src/server_components/session_token_verifier.py, function: SessionFileTokenVerifier.verify_token, lines: [48, 79]}
    - {file: src/client/connection.py, function: _get_client_by_token, lines: [282, 302]}
    - {file: src/client/connection.py, function: _build_telegram_client_for_token, lines: [211, 244]}
