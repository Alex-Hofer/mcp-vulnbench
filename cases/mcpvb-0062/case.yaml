source: ghsa
split: null
notes: "The urls argument of the download_media tool is requested with Playwright's ctx.request.get() in the tool handler and the url argument of auth_fetch is opened with page.goto() in navigateTo, both without any check of the target, so loopback, private-network and metadata URLs are fetched (download_media also writes the body to the caller-chosen output_dir). The fix adds src/security.ts with assertSafeUrl (http/https only, DNS resolution, private/loopback/link-local ranges rejected) and calls it before both requests; it also confines output_dir with resolveSafeOutputDir and removes makeDownloadDir, which is not part of this SSRF case. The fix is the merge commit of the advisory fork (c5c523c plus the 3.0.1 version bump); the vulnerable commit is its first parent. Fix: https://github.com/ymw0407/auth-fetch-mcp/commit/42daa70c391cde4396de877541a64a9c3f761a9d Caveat: the new assertSafeUrl misses IPv4-mapped IPv6 addresses in hex form (GHSA-pvrj-8cg3-j5f8, fixed later), so an SSRF finding in the fixed locations may be a true positive for that bug rather than a missed fix."
