id: mcpvb-0062
title: "SSRF in download_media and auth_fetch of auth-fetch-mcp"
advisories: [GHSA-hv85-774v-26fg]
repo: https://github.com/ymw0407/auth-fetch-mcp
license: MIT
language: typescript
subdir: null
class: ssrf
cwe: CWE-918
mcp_tool: download_media
vulnerable:
  commit: daf65d459a7d4a7392a3d3f8a0d07fae328e996c
  locations:
    - {file: src/tools.ts, function: "<anonymous> tool download_media", lines: [221, 277]}
    - {file: src/browser.ts, function: navigateTo, lines: [53, 65]}
fixed:
  commit: 42daa70c391cde4396de877541a64a9c3f761a9d
  locations:
