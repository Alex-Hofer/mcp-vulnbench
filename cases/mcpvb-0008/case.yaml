id: mcpvb-0008
title: "Path traversal (arbitrary file read) in confluence_upload_attachment of mcp-atlassian"
advisories: [CVE-2026-77269, GHSA-h7wj-5v37-59r2, CVE-2026-77258, GHSA-93xw-j965-9mx3, CVE-2026-77262, GHSA-p6hp-93wp-fh6p, CVE-2026-77270, GHSA-f26r-j276-ggg4]
repo: https://github.com/sooperset/mcp-atlassian
license: MIT
language: python
subdir: null
class: path-traversal
cwe: CWE-22
mcp_tool: confluence_upload_attachment
vulnerable:
  commit: 4067d1db4097755cc6add87f95fe3f0746c98c0b
  locations:
    - {file: src/mcp_atlassian/confluence/attachments.py, function: AttachmentsMixin.upload_attachment, lines: [124, 197]}
    - {file: src/mcp_atlassian/confluence/attachments.py, function: AttachmentsMixin._upload_attachment_direct, lines: [612, 647]}
    - {file: src/mcp_atlassian/jira/attachments.py, function: AttachmentsMixin.upload_attachment, lines: [353, 415]}
fixed:
  commit: b041733473f95119dd539542a43c280737a8e460
  locations:
    - {file: src/mcp_atlassian/confluence/attachments.py, function: AttachmentsMixin.upload_attachment, lines: [124, 198]}
    - {file: src/mcp_atlassian/confluence/attachments.py, function: AttachmentsMixin._upload_attachment_direct, lines: [613, 648]}
    - {file: src/mcp_atlassian/jira/attachments.py, function: AttachmentsMixin.upload_attachment, lines: [364, 427]}
source: ghsa
split: null
notes: "The file_path argument of confluence_upload_attachment (also confluence_upload_attachments, and the attachments argument of jira_update_issue via the Jira upload_attachment) reaches open(file_path, 'rb') without any confinement, so any file readable by the server can be exfiltrated as an attachment; the fix confines upload paths to the working directory with validate_safe_path() in the Confluence and Jira upload_attachment methods. GHSA-93xw-j965-9mx3, GHSA-p6hp-93wp-fh6p and GHSA-f26r-j276-ggg4 report the same bug. Fix: https://github.com/sooperset/mcp-atlassian/pull/1448 (squash commit b041733473f95119dd539542a43c280737a8e460)"
