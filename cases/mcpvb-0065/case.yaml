split: null
notes: "The url argument of the webpage-to-markdown, youtube-to-markdown and bing-search-to-markdown tools is passed by the CallTool handler to Markdownify.toMarkdown, which requests it with fetch() and returns the converted body, so internal and loopback URLs can be read. The fix validates the URL in the handler before the call: only http/https and no private address literal (private-ip on the parsed hostname); Markdownify.toMarkdown with the fetch() sink is unchanged. The advisory text names Markdownify.get(), but the request is made in toMarkdown. Fixed commit is the merge commit of pull request #17 (two commits, 3166d86 and 3667bd4), vulnerable its first parent. Fix: https://github.com/zcaceres/markdownify-mcp/commit/0284aa8f34d32c65e20d8cda2d429b7943c9af03"
