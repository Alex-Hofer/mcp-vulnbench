vulnerable:
  commit: 949f12e633320548c565c6ec892d33695b158d64
  locations:
    - {file: src/server.ts, function: "<anonymous> CallTool handler", lines: [39, 111]}
    - {file: src/Markdownify.ts, function: Markdownify.toMarkdown, lines: [51, 92]}
fixed:
