class: path-traversal
cwe: CWE-22
mcp_tool: browser_download
vulnerable:
  commit: b106ffe0fcf2c46b9a23bfefd990ef8618dcc0c2
  locations:
    - {file: src/download.ts, function: downloadUrl, lines: [24, 79]}
    - {file: src/download.ts, function: fetchFallback, lines: [81, 110]}
    - {file: src/state.ts, function: resolveStatePath, lines: [12, 21]}
    - {file: src/tools/session.ts, function: browser_save_state, lines: [221, 231]}
fixed:
