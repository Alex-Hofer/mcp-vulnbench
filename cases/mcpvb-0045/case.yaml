id: mcpvb-0045
title: "Command injection in import_tmx of lara-mcp"
advisories: [CVE-2025-53832, GHSA-xj5p-8h7g-76m7]
repo: https://github.com/translated/lara-mcp
license: MIT
language: typescript
subdir: null
class: command-injection
cwe: CWE-78
mcp_tool: import_tmx
vulnerable:
  commit: ab6ddeb55ab87c0df28822f968b7e24364ca02c5
  locations:
    - {file: src/tools/import_tmx.ts, function: importTmx, lines: [37, 69]}
fixed:
  commit: e534ef690adf390e4ac862a200b2a83f6cf45944
  locations:
    - {file: src/mcp/tools/import_tmx.ts, function: importTmx, lines: [20, 48]}
source: ghsa
split: null
notes: "importTmx downloaded the file named by the tmx_url argument of the import_tmx tool with `curl -L \"${tmx_url}\" -o \"${tempFilePath}\"` run through child_process.exec, so a URL containing a double quote or $(...) executed arbitrary commands. The fix removes the tmx_url option and the curl call, so the tool only accepts tmx_content; it is part of the squash commit of the feature PR 'Streammable HTTP events', which also moved the file from src/tools/ to src/mcp/tools/. Fix: https://github.com/translated/lara-mcp/commit/e534ef690adf390e4ac862a200b2a83f6cf45944 (PR #10, released as v0.0.12) The advisory lists CWE-77, but the sink is an OS command string, so the case uses CWE-78."
