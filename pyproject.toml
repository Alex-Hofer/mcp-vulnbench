[project]
name = "mcp-vulnbench"
version = "0.2.0"
description = "Benchmark of real vulnerabilities in MCP servers and a harness that evaluates static analyzers on them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alex Hofer" }]
dependencies = [
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
mcpvb = "mcpvb.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpvb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and built images (deselect with -m 'not docker')"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
